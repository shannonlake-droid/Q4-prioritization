// ─── COUNTS ──────────────────────────────────────────────────────────────────

function allItems() {
  return areas.flatMap(a => a.subsections.flatMap(s => s.items));
}

function countBy(fn) {
  return allItems().reduce((acc, item) => {
    const key = fn(item);
    acc[key] = (acc[key] || 0) + 1;
    return acc;
  }, {});
}

function priorityCounts() { return countBy(i => i.priority.toLowerCase()); }
function actionCounts() {
  return allItems().reduce((acc, item) => {
    let a = item.action.toLowerCase();
    if (a === "continue" || a === "complete") acc["continue"] = (acc["continue"] || 0) + 1;
    else if (a.includes("stop")) acc["stop"] = (acc["stop"] || 0) + 1;
    else if (a.includes("rescope")) acc["rescope"] = (acc["rescope"] || 0) + 1;
    else if (a === "start") acc["start"] = (acc["start"] || 0) + 1;
    else acc["other"] = (acc["other"] || 0) + 1;
    return acc;
  }, {});
}

function areaItemCount(area) { return area.subsections.flatMap(s => s.items).length; }

// ─── RENDER SUMMARY ──────────────────────────────────────────────────────────

function renderSummary() {
  const pc = priorityCounts();
  const ac = actionCounts();
  const grid = document.getElementById("summaryGrid");
  const cards = [
    { cls: "card-high",     count: pc["high"]   || 0, label: "High Priority" },
    { cls: "card-med",      count: pc["medium"] || 0, label: "Medium Priority" },
    { cls: "card-low",      count: pc["low"]    || 0, label: "Low Priority" },
    { cls: "card-na",       count: (pc["n/a"]||0) + (pc["tba"]||0), label: "Unrated" },
    { cls: "card-continue", count: ac["continue"] || 0, label: "Continue / Complete" },
    { cls: "card-rescope",  count: ac["rescope"]  || 0, label: "Rescope" },
    { cls: "card-stop",     count: ac["stop"]     || 0, label: "Stop" },
    { cls: "card-start",    count: ac["start"]    || 0, label: "Start" },
  ];
  // Insert divider after index 3
  grid.innerHTML = cards.map((c, i) =>
    (i === 4 ? `<div class="divider"></div>` : '') +
    `<div class="summary-card ${c.cls}"><div class="count">${c.count}</div><div class="label">${c.label}</div></div>`
  ).join('');
}

// ─── RENDER TABS ─────────────────────────────────────────────────────────────

function renderTabs() {
  const tabsEl = document.getElementById("tabs");
  const panelsEl = document.getElementById("panels");

  tabsEl.innerHTML = areas.map((a, i) =>
    `<button class="tab ${i===0?'active':''}" onclick="switchTab('${a.id}')" id="tab-${a.id}">
      ${a.name} <span class="tab-count">${areaItemCount(a)}</span>
    </button>`
  ).join('');

  panelsEl.innerHTML = areas.map((a, i) =>
    `<div class="focus-panel ${i===0?'active':''}" id="panel-${a.id}">
      ${renderArea(a)}
    </div>`
  ).join('');
}

function switchTab(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.focus-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  document.getElementById('panel-' + id).classList.add('active');
}

// ─── RENDER AREA ─────────────────────────────────────────────────────────────

function pillClass(val) {
  const v = (val || '').toLowerCase();
  if (v === 'high') return 'pill-high';
  if (v === 'medium') return 'pill-medium';
  if (v === 'low') return 'pill-low';
  if (v === 'tba') return 'pill-tba';
  if (v === 'n/a' || v === '') return 'pill-na';
  return 'pill-na';
}

function actionPillClass(val) {
  const v = (val || '').toLowerCase();
  if (v === 'continue') return 'pill-continue';
  if (v === 'complete') return 'pill-complete';
  if (v.includes('rescope')) return 'pill-rescope';
  if (v.includes('stop')) return 'pill-stop';
  if (v === 'start') return 'pill-start';
  if (v.includes('awaiting')) return 'pill-awaiting';
  if (v === 'tba') return 'pill-tba';
  if (v.includes('continue') && v.includes('start')) return 'pill-start';
  return 'pill-na';
}

function renderArea(area) {
  const areaStats = area.subsections.flatMap(s => s.items).reduce((acc, item) => {
    const a = item.action.toLowerCase();
    if (a === 'continue' || a === 'complete' || a.includes('continue')) acc.continue++;
    else if (a.includes('stop')) acc.stop++;
    else if (a.includes('rescope')) acc.rescope++;
    else if (a === 'start' || a.includes('start')) acc.start++;
    return acc;
  }, {continue: 0, stop: 0, rescope: 0, start: 0});

  const statBadges = `
    <div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;">
      ${areaStats.continue ? `<span class="pill pill-continue">▶ Continue: ${areaStats.continue}</span>` : ''}
      ${areaStats.rescope  ? `<span class="pill pill-rescope">⟳ Rescope: ${areaStats.rescope}</span>` : ''}
      ${areaStats.stop     ? `<span class="pill pill-stop">■ Stop: ${areaStats.stop}</span>` : ''}
      ${areaStats.start    ? `<span class="pill pill-start">+ Start: ${areaStats.start}</span>` : ''}
    </div>`;

  const tables = area.subsections.map(sub => `
    <div class="sub-section">
      <div class="sub-title">${sub.title}</div>
      <table>
        <thead>
          <tr>
            <th style="width:32%">Project / Work Stream</th>
            <th style="width:10%">Priority</th>
            <th style="width:12%">Action</th>
            <th>Notes / Impact / Timing</th>
          </tr>
        </thead>
        <tbody>
          ${sub.items.map(item => `
          <tr>
            <td class="project">${item.project}</td>
            <td><span class="pill ${pillClass(item.priority)}">${item.priority}</span></td>
            <td><span class="pill ${actionPillClass(item.action)}">${item.action}</span></td>
            <td class="notes">${item.notes}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `).join('');

  return statBadges + tables;
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
renderSummary();
renderTabs();
</script>
